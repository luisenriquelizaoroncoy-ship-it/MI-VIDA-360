name: Recordatorios MI VIDA 360
on:
  schedule:
    # Revisión cada 15 minutos, hora local calculada en America/Lima.
    # GitHub Actions puede retrasar o saltar ejecuciones programadas.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:
    inputs:
      probar_aviso:
        description: 'Enviar un aviso de prueba a los dispositivos de la cuenta única'
        type: boolean
        required: false
        default: false
  # Al publicar cambios en el envío, procesa los avisos que correspondan a esa hora.
  push:
    branches: [main]
    paths:
      - '.github/workflows/reminders.yml'
      - 'scripts/send-reminders.cjs'
permissions:
  contents: read
concurrency:
  group: mi-vida-360-reminders
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Firebase Admin
        run: npm install --no-save --ignore-scripts firebase-admin@13
      - name: Revisar pagos, agenda y compras
        env:
          MI360_TEST_PUSH: ${{ github.event_name == 'workflow_dispatch' && inputs.probar_aviso }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/send-reminders.cjs
