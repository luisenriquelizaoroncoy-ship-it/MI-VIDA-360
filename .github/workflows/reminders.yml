name: Recordatorios MI VIDA 360
on:
  schedule:
    - cron: '7 14 * * *' # 09:07 en Lima (UTC-5)
  workflow_dispatch:
permissions:
  contents: read
jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar SDK Firebase Admin
        run: npm install --no-save --ignore-scripts firebase-admin@13
      - name: Revisar pagos y enviar notificaciones
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/send-reminders.cjs
