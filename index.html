<script>
(function(){'use strict';
const KEY='mivida360_mobile_v1';
const icons={inicio:'i-home',gastos:'i-wallet',ahorros:'i-save',compras:'i-bag',agenda:'i-cal',pagos:'i-card'};
const labels={inicio:'Inicio',gastos:'Gastos',ahorros:'Ahorros',compras:'Compras',agenda:'Agenda',pagos:'Pagos'};
const catExpense=['Alimentación','Transporte','Vivienda','Servicios','Estudios','Salud','Salidas','Compras','Otros'];
const catIncome=['Sueldo','Comisiones','Ventas','Otros'];
const colors=['#536ff4','#28a58e','#e5a14b','#ed777e','#8d72df','#47a1d3','#a3b751','#d193b4','#71829c'];
const dateToday=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const monthToday=dateToday().slice(0,7);
function emptyState(){return {movements:[],goals:[],purchases:[],events:[],payments:[]}}
let state=load(), tab='inicio',currentMonth=monthToday;
let accessMode='locked', accountUser=null, accountApi=null, cloudWrites=0;
const accountCacheKey=uid=>'mivida360_cloud_cache_'+uid;
function hasItems(data){return !!data&&Object.values(data).some(v=>Array.isArray(v)&&v.length>0)}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&typeof v==='object') return normalize(v)}catch(e){}return emptyState()}
function normalize(obj){const out=emptyState();for(const k of Object.keys(out)){out[k]=Array.isArray(obj[k])?obj[k].filter(x=>x&&typeof x==='object').slice(0,10000):[]}return out}
function persist(){
 if(accessMode==='cloud'&&accountUser&&accountApi){
  try{localStorage.setItem(accountCacheKey(accountUser.uid),JSON.stringify(state))}catch(e){}
  const snapshot=JSON.parse(JSON.stringify(state));cloudWrites++;
  accountApi.save(snapshot).catch(e=>{console.warn('MI VIDA 360: no se sincronizó',e);alert('No se pudo sincronizar con Firebase. Conserva una copia JSON de tus datos cuando puedas.');}).finally(()=>cloudWrites--);
  return true;
 }
 if(accessMode==='local'){
  try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('No se pudo guardar. Descarga una copia de tus datos.');return false}
 }
 return false;
}
const id=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.floor(Math.random()*999999)}`;
const money=n=>'S/ '+(Number(n)||0).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const parseDate=d=>new Date((/^\d{4}-\d\d-\d\d$/.test(d)?d:dateToday())+'T12:00:00');
const pretty=d=>{try{return parseDate(d).toLocaleDateString('es-PE',{day:'2-digit',month:'short'})}catch(e){return d}};
const getMonth=d=>String(d||'').slice(0,7);
const upper=s=>s.charAt(0).toUpperCase()+s.slice(1);
function svg(n){return `<svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#${n}" /></svg>`}
function newbutton(type,label='Agregar'){return `<button class="primary smallbtn bigaction" data-action="new" data-kind="${type}">${svg('i-plus')}${label}</button>`}
function header(title,desc,btn){return `<div class="eyebrow">MI VIDA 360</div><div class="hero"><div><h1>${esc(title)}</h1><p class="sub">${esc(desc)}</p></div>${btn||''}</div>`}
const card=(title,inner,right='')=>`<section class="section"><div class="sectionhead"><h2>${title}</h2>${right}</div>${inner}</section>`;
function empty(title,desc='',button=''){return `<div class="empty"><div class="emoji">◇</div><b>${esc(title)}</b><span>${esc(desc)}</span>${button}</div>`}
function moneyByMonth(month){let arr=state.movements.filter(v=>getMonth(v.date)===month);return {income:arr.filter(x=>x.type==='ingreso').reduce((s,x)=>s+Number(x.amount||0),0),expense:arr.filter(x=>x.type==='gasto').reduce((s,x)=>s+Number(x.amount||0),0)}}
function spentByCategory(month){const r={};state.movements.filter(x=>x.type==='gasto'&&getMonth(x.date)===month).forEach(x=>r[x.category]=(r[x.category]||0)+Number(x.amount));return Object.entries(r).sort((a,b)=>b[1]-a[1])}
function goalTotal(g){return Math.max(0,(g.entries||[]).reduce((s,x)=>s+Number(x.amount||0),0))}
function sumGoals(){return state.goals.reduce((s,x)=>s+goalTotal(x),0)}
function nav(){document.getElementById('nav').innerHTML=Object.keys(labels).map(k=>`<button type="button" class="${k===tab?'active':''}" data-tab="${k}" aria-current="${k===tab?'page':'false'}">${svg(icons[k])}<span>${labels[k]}</span></button>`).join('')}
function render(){nav();document.getElementById('main').innerHTML=({inicio:renderHome,gastos:renderExpenses,ahorros:renderSavings,compras:renderPurchases,agenda:renderAgenda,pagos:renderPayments}[tab])();}
function navigate(t){tab=t;render();window.scrollTo(0,0)}
function monthsChart(){let days=[];let d=new Date(Number(currentMonth.slice(0,4)),Number(currentMonth.slice(5))-1,1);for(let i=5;i>=0;i--){let x=new Date(d.getFullYear(),d.getMonth()-i,1);days.push(`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`)}let points=days.map(m=>({m,...moneyByMonth(m)}));let max=Math.max(1,...points.flatMap(x=>[x.income,x.expense]));return `<div class="chart">${points.map(x=>`<div class="chartcol"><div class="bars"><div style="background:#526df8;height:${Math.max(3,Math.round(x.income/max*85))}px" title="Ingresos ${money(x.income)}"></div><div style="background:#ed939a;height:${Math.max(3,Math.round(x.expense/max*85))}px" title="Gastos ${money(x.expense)}"></div></div><span class="chartlbl">${upper(new Date(x.m+'-15T12:00:00').toLocaleDateString('es-PE',{month:'short'})).replace('.','')}</span></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#526df8"></i>Ingresos</span><span><i class="dot" style="background:#ed939a"></i>Gastos</span></div>`}
function movementRow(v,editable=false){let inc=v.type==='ingreso';return `<div class="item"><div class="itemico" style="background:${inc?'#eaf8f2':'#fff2f3'};color:${inc?'#20a17f':'#e77c83'}">${inc?'↗':'↘'}</div><div class="itemmain"><div class="itemtitle">${esc(v.title)}</div><div class="itemsub">${esc(v.category)} · ${pretty(v.date)}</div></div><div class="itemright"><div class="amount ${inc?'pos':'neg'}">${inc?'+':'−'}${money(v.amount)}</div>${editable?`<div class="actions"><button data-action="edit" data-kind="movement" data-id="${esc(v.id)}">Editar</button><button data-action="delete" data-kind="movement" data-id="${esc(v.id)}">Borrar</button></div>`:''}</div></div>`}
function renderHome(){const r=moneyByMonth(currentMonth);let sorted=state.movements.filter(x=>getMonth(x.date)===currentMonth).sort((a,b)=>String(b.date).localeCompare(a.date)).slice(0,4);const cats=spentByCategory(currentMonth);let maxCat=cats[0]?.[1]||1;let upcoming=state.events.filter(x=>!x.completed&&x.date>=dateToday()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))[0];let pay=state.payments.filter(x=>!x.paid).sort((a,b)=>a.due.localeCompare(b.due))[0];return header('Tu panorama','Todo lo importante, en un solo lugar.',newbutton('movement','Nuevo gasto'))+
`<div class="datebar"><div class="monthwrap"><input id="month" type="month" value="${currentMonth}" aria-label="Mes del resumen"></div><span class="hint">Resumen mensual</span></div>`+
`<div class="statgrid"><div class="stat green"><div class="stathead">Ingresos <span class="bubble">↗</span></div><strong>${money(r.income)}</strong><div class="statfoot">Lo que recibiste este mes</div></div><div class="stat red"><div class="stathead">Gastos <span class="bubble">↘</span></div><strong>${money(r.expense)}</strong><div class="statfoot">Tus salidas de dinero</div></div><div class="stat blue"><div class="stathead">Ahorros <span class="bubble">◇</span></div><strong>${money(sumGoals())}</strong><div class="statfoot">Registrados en tus metas</div></div><div class="stat orange"><div class="stathead">Balance del mes <span class="bubble">▣</span></div><strong>${money(r.income-r.expense)}</strong><div class="statfoot">Ingresos menos gastos</div></div></div>`+
alertPanel()+card('Ingresos vs. gastos',monthsChart(),'<span class="muted">Últimos 6 meses</span>')+
card('¿En qué gastaste?',cats.length?cats.slice(0,5).map(([k,v],i)=>`<div class="categoryline"><div class="categoryhead"><span>${esc(k)}</span><strong>${money(v)}</strong></div><div class="progress"><span style="width:${v/maxCat*100}%;background:${colors[i%colors.length]}"></span></div></div>`).join(''):empty('Todavía no hay gastos','Registra un gasto para verlo aquí.'),'<span class="muted">Este mes</span>')+
card('Movimientos recientes',sorted.length?`<div class="rows">${sorted.map(x=>movementRow(x)).join('')}</div>`:empty('Sin movimientos','Empieza con tu primer ingreso o gasto.',newbutton('movement','Registrar')),`<button class="outline smallbtn" data-tab="gastos">Ver todos</button>`)+
card('Tus metas de ahorro',state.goals.length?state.goals.slice(0,2).map(g=>goalSnippet(g)).join(''):empty('Aún no tienes metas','Crea una meta para ver tu progreso.'),`<button class="outline smallbtn" data-tab="ahorros">Ver metas</button>`)+
card('Próximos compromisos',upcoming?`<div class="item"><div class="itemico">▦</div><div class="itemmain"><div class="itemtitle">${esc(upcoming.title)}</div><div class="itemsub">${pretty(upcoming.date)} · ${esc(upcoming.time||'Todo el día')}</div></div></div>`:empty('Sin compromisos próximos','Añade tus horarios y citas.'),`<button class="outline smallbtn" data-tab="agenda">Mi agenda</button>`)+
card('Pagos pendientes',pay?`<div class="item"><div class="itemico" style="background:#fff3e7;color:#d88e35">▣</div><div class="itemmain"><div class="itemtitle">${esc(pay.title)}</div><div class="itemsub">Vence: ${pretty(pay.due)}</div></div><div class="itemright"><div class="amount">${money(pay.amount)}</div></div></div>`:empty('Sin pagos pendientes','Registra las cuotas o recibos que debas pagar.'),`<button class="outline smallbtn" data-tab="pagos">Ver pagos</button>`)+
`<div class="footnote">Tus datos se guardan en este navegador. Exporta una copia desde ⚙ para protegerlos.</div>`}
function renderExpenses(){let arr=[...state.movements].sort((a,b)=>String(b.date).localeCompare(a.date));let r=moneyByMonth(currentMonth);let shown=arr.filter(x=>getMonth(x.date)===currentMonth);return header('Mis movimientos','Registra ingresos y gastos sin complicarte.',newbutton('movement','Añadir'))+`<div class="datebar"><div class="monthwrap"><input type="month" id="month" value="${currentMonth}"></div></div>`+`<div class="statgrid"><div class="stat green"><div class="stathead">Entró</div><strong>${money(r.income)}</strong></div><div class="stat red"><div class="stathead">Salió</div><strong>${money(r.expense)}</strong></div></div>`+card('Movimientos del mes',shown.length?shown.map(x=>movementRow(x,true)).join(''):empty('Mes sin movimientos','Puedes añadir ingresos o gastos con el botón de arriba.'))}
function goalSnippet(g){let cur=goalTotal(g),target=Math.max(0,Number(g.target)||0),pct=target>0?Math.min(100,cur/target*100):0;return `<div style="padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid #f0f3f8"><div class="progresslabel"><strong style="color:#273952">${esc(g.title)}</strong><span>${Math.round(pct)} %</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="progresslabel" style="margin-top:8px;margin-bottom:0"><span>${money(cur)} ahorrados</span><span>Meta: ${money(target)}</span></div></div>`}
function renderSavings(){return header('Mis ahorros','Cada aporte cuenta para tus metas.',newbutton('goal','Nueva meta'))+card('Total reservado',`<div class="smallstat"><span class="secondarytxt">Ahorros registrados</span><strong>${money(sumGoals())}</strong></div><div class="safezone">Este total es un registro de metas, no un saldo bancario verificado.</div>`)+card('Metas de ahorro',state.goals.length?state.goals.map(g=>`<div style="margin-bottom:20px">${goalSnippet(g)}<div class="toolbar"><button class="primary smallbtn" data-action="contribute" data-id="${esc(g.id)}">+ Aporte</button><button class="outline smallbtn" data-action="edit" data-kind="goal" data-id="${esc(g.id)}">Editar meta</button><button class="outline smallbtn danger" data-action="delete" data-kind="goal" data-id="${esc(g.id)}">Borrar</button></div></div>`).join(''):empty('Crea tu primera meta','Por ejemplo, ahorrar para una compra o un fondo de emergencia.',newbutton('goal','Crear meta')))}
function renderPurchases(){let pending=state.purchases.filter(x=>!x.bought);let bought=state.purchases.filter(x=>x.bought);let total=pending.reduce((s,x)=>s+Number(x.price||0),0);let row=x=>`<div class="item"><div class="itemico" style="background:${x.bought?'#eaf8f2':'#eef1ff'};color:${x.bought?'#229e7f':'#536bf6'}">${x.bought?'✓':'◇'}</div><div class="itemmain"><div class="itemtitle">${esc(x.title)}</div><div class="itemsub">${esc(x.priority||'Normal')} · ${x.bought?'Comprado':'Pendiente'}${x.due?' · Fecha límite: '+pretty(x.due):''}</div><div class="actions" style="justify-content:flex-start"><button data-action="toggle" data-kind="purchase" data-id="${esc(x.id)}">${x.bought?'Volver a pendiente':'Marcar comprado'}</button><button data-action="edit" data-kind="purchase" data-id="${esc(x.id)}">Editar</button><button data-action="delete" data-kind="purchase" data-id="${esc(x.id)}">Borrar</button></div></div><div class="itemright"><div class="amount">${money(x.price)}</div></div></div>`;return header('Mis compras','Lo que quiero comprar, sin perder el control.',newbutton('purchase','Añadir'))+card('Total pendiente',`<div class="smallstat"><span class="secondarytxt">${pending.length} compras por realizar</span><strong>${money(total)}</strong></div><div class="safezone">Marcar una compra no registra un gasto. Si la pagas, añádelo en Gastos.</div>`)+card('Por comprar',pending.length?pending.map(row).join(''):empty('Nada pendiente','Agrega algo a tu lista de compras.'))+(bought.length?card('Ya compré',bought.map(row).join('')):'')}
function renderAgenda(){let sorted=[...state.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));let today=dateToday();return header('Mi agenda','Horarios, pendientes y compromisos.',newbutton('event','Añadir'))+card('Próximas actividades',sorted.filter(x=>!x.completed&&x.date>=today).length?sorted.filter(x=>!x.completed&&x.date>=today).map(x=>eventrow(x)).join(''):empty('Sin actividades próximas','Registra un compromiso, clase o recordatorio.'))+(sorted.some(x=>!x.completed&&x.date<today)?card('Actividades anteriores',sorted.filter(x=>!x.completed&&x.date<today).reverse().slice(0,10).map(x=>eventrow(x)).join('')):'')+ (sorted.some(x=>x.completed)?card('Actividades completadas',sorted.filter(x=>x.completed).reverse().slice(0,10).map(x=>eventrow(x)).join('')):'')}
function eventrow(x){return `<div class="item"><div class="itemico">▦</div><div class="itemmain"><div class="itemtitle">${esc(x.title)}</div><div class="itemsub">${pretty(x.date)} ${x.time?'· '+esc(x.time):''} · ${esc(x.category||'Personal')}${x.completed?' · ✓ Completado':' · Pendiente'}</div><div class="actions" style="justify-content:flex-start"><button data-action="toggle" data-kind="event" data-id="${esc(x.id)}">${x.completed?'Marcar pendiente':'Marcar completado'}</button><button data-action="edit" data-kind="event" data-id="${esc(x.id)}">Editar</button><button data-action="delete" data-kind="event" data-id="${esc(x.id)}">Borrar</button></div></div></div>`}
function renderPayments(){let pending=state.payments.filter(x=>!x.paid).sort((a,b)=>a.due.localeCompare(b.due));let paid=state.payments.filter(x=>x.paid).sort((a,b)=>b.due.localeCompare(a.due));const row=x=>`<div class="item"><div class="itemico" style="background:${x.paid?'#e9f8f1':'#fff1e7'};color:${x.paid?'#26a281':'#db9149'}">${x.paid?'✓':'▣'}</div><div class="itemmain"><div class="itemtitle">${esc(x.title)}</div><div class="itemsub">${x.paid?'Pagado':'Vence'}: ${pretty(x.due)}${!x.paid&&x.due<dateToday()?' · Vencido':''}</div><div class="actions" style="justify-content:flex-start"><button data-action="toggle" data-kind="payment" data-id="${esc(x.id)}">${x.paid?'Marcar pendiente':'Marcar pagado'}</button><button data-action="edit" data-kind="payment" data-id="${esc(x.id)}">Editar</button><button data-action="delete" data-kind="payment" data-id="${esc(x.id)}">Borrar</button></div></div><div class="itemright"><div class="amount">${money(x.amount)}</div></div></div>`;return header('Mis pagos','Recibos, cuotas y fechas de vencimiento.',newbutton('payment','Añadir'))+card('Total por pagar',`<div class="smallstat"><span class="secondarytxt">${pending.length} pagos pendientes</span><strong>${money(pending.reduce((s,x)=>s+Number(x.amount),0))}</strong></div><div class="safezone">Marcar como pagado no registra un gasto automáticamente.</div>`)+card('Pendientes',pending.length?pending.map(row).join(''):empty('Sin pagos pendientes','Agrega fechas para tenerlas a la vista.'))+(paid.length?card('Pagados',paid.slice(0,12).map(row).join('')):'')}
function modal(title,inner){document.getElementById('modalRoot').innerHTML=`<div class="sheetback" id="back"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheethead"><h2>${esc(title)}</h2><button type="button" class="x" data-action="close" aria-label="Cerrar">×</button></div>${inner}</div></div>`;document.body.style.overflow='hidden';setTimeout(()=>document.querySelector('.sheet input:not([type=hidden])')?.focus(),40)}
function close(){document.getElementById('modalRoot').innerHTML='';document.body.style.overflow=''}
const field=(name,label,value='',type='text',extra='')=>`<label><span class="fieldlabel">${label}</span><input name="${name}" type="${type}" value="${esc(value)}" ${extra} /></label>`;
const select=(name,label,opts,value)=>`<label><span class="fieldlabel">${label}</span><select name="${name}">${opts.map(v=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(v)}</option>`).join('')}</select></label>`;
const form=(kind,body,editId)=>`<form id="editForm" data-kind="${kind}" data-id="${esc(editId||'')}"><div class="formgrid">${body}</div><button class="primary submit" type="submit">${editId?'Guardar cambios':'Guardar'}</button></form>`;
function openForm(kind,editing=null){const v=editing||{};let content='';let title='';if(kind==='movement'){
let t=v.type||'gasto';title=editing?'Editar movimiento':'Nuevo movimiento';content=`<div class="seg"><button class="${t==='gasto'?'on':''}" type="button" data-action="movetype" data-value="gasto">Gasto</button><button class="${t==='ingreso'?'on':''}" type="button" data-action="movetype" data-value="ingreso">Ingreso</button></div>`+form(kind,`<input type="hidden" name="type" value="${t}"><div class="full">${field('title','¿En qué fue?',v.title||'','text','required maxlength="80" placeholder="Ej.: Almuerzo"')}</div>${field('amount','Monto (S/)',v.amount||'','number','required min="0.01" step="0.01" inputmode="decimal"')}${field('date','Fecha',v.date||dateToday(),'date','required')}<div class="full" id="catSelect">${select('category','Categoría',t==='ingreso'?catIncome:catExpense,v.category||(t==='ingreso'?'Sueldo':'Alimentación'))}</div>`,v.id);
}else if(kind==='goal'){title=editing?'Editar meta':'Nueva meta';content=form(kind,`<div class="full">${field('title','Nombre de la meta',v.title||'','text','required maxlength="70" placeholder="Ej.: Fondo de emergencia"')}</div><div class="full">${field('target','¿Cuánto quieres ahorrar? (S/)',v.target||'','number','required min="0.01" step="0.01" inputmode="decimal"')}</div>`,v.id);
}else if(kind==='purchase'){title=editing?'Editar compra':'Nueva compra';content=form(kind,`<div class="full">${field('title','¿Qué quieres comprar?',v.title||'','text','required maxlength="80"')}</div>${field('price','Precio estimado (S/)',v.price||'','number','required min="0" step="0.01" inputmode="decimal"')}${select('priority','Prioridad',['Alta','Media','Baja'],v.priority||'Media')}${field('due','Fecha límite (opcional)',v.due||'','date')}`,v.id);
}else if(kind==='event'){title=editing?'Editar actividad':'Nueva actividad';content=form(kind,`<div class="full">${field('title','Actividad o compromiso',v.title||'','text','required maxlength="90"')}</div>${field('date','Fecha',v.date||dateToday(),'date','required')}${field('time','Hora',v.time||'','time')}${select('category','Tipo',['Personal','Trabajo','Estudios','Salud','Otros'],v.category||'Personal')}`,v.id);
}else if(kind==='payment'){title=editing?'Editar pago':'Nuevo pago';content=form(kind,`<div class="full">${field('title','¿Qué tienes que pagar?',v.title||'','text','required maxlength="90"')}</div>${field('amount','Monto (S/)',v.amount||'','number','required min="0.01" step="0.01" inputmode="decimal"')}${field('due','Vencimiento',v.due||dateToday(),'date','required')}${select('recurrence','Repetir pago',['No repetir','Mensual'],v.recurrence||'No repetir')}`,v.id)
}modal(title,content)}
function openContribute(goalId){let g=state.goals.find(x=>x.id===goalId);if(!g)return;modal('Aporte a '+g.title,form('contribute',`<input type="hidden" name="goalId" value="${esc(goalId)}"><div class="full">${select('direction','Movimiento',['Agregar ahorro','Retirar ahorro'],'Agregar ahorro')}</div><div class="full">${field('amount','Monto (S/)', '', 'number','required min="0.01" step="0.01" inputmode="decimal"')}</div>`,null))}
function formData(form){return Object.fromEntries(new FormData(form).entries())}
function validateMoney(v,zero=false){let n=Number(v);return Number.isFinite(n)&&n>=(zero?0:0.01)&&n<=999999999?n:null}
function shiftMonth(ymd,n){const [y,m,d]=ymd.split('-').map(Number);const target=new Date(y,m-1+n,1,12);const last=new Date(target.getFullYear(),target.getMonth()+1,0).getDate();return target.getFullYear()+'-'+String(target.getMonth()+1).padStart(2,'0')+'-'+String(Math.min(d,last)).padStart(2,'0')}
function generateRecurring(){let changed=false;const horizon=new Date();horizon.setDate(horizon.getDate()+92);const limit=horizon.getFullYear()+'-'+String(horizon.getMonth()+1).padStart(2,'0')+'-'+String(horizon.getDate()).padStart(2,'0');const seen=new Set(state.payments.filter(p=>p.recurrenceFrom).map(p=>p.recurrenceFrom+'|'+p.due));for(const p of [...state.payments]){if(p.recurrence!=='Mensual'||p.recurrenceFrom||!/^\d{4}-\d\d-\d\d$/.test(p.due))continue;for(let n=1;n<=24;n++){const due=shiftMonth(p.due,n);if(due>limit)break;const key=p.id+'|'+due;if(!seen.has(key)){state.payments.push({id:id(),title:p.title,amount:p.amount,due,paid:false,recurrence:'No repetir',recurrenceFrom:p.id});seen.add(key);changed=true}}}if(changed)persist()}
function dueAlerts(){const today=dateToday();const soon=new Date();soon.setDate(soon.getDate()+7);const limit=soon.getFullYear()+'-'+String(soon.getMonth()+1).padStart(2,'0')+'-'+String(soon.getDate()).padStart(2,'0');return state.payments.filter(p=>!p.paid&&p.due<=limit).sort((a,b)=>a.due.localeCompare(b.due))}
function alertPanel(){const arr=dueAlerts();return arr.length?'<section class="alertcard"><h2>⚠ Pagos por atender ('+arr.length+')</h2>'+arr.slice(0,5).map(p=>'<div class="alertentry"><span>'+esc(p.title)+' · '+pretty(p.due)+'</span><strong>'+esc(p.due<dateToday()?'Vencido · ':'')+money(p.amount)+'</strong></div>').join('')+'<button class="outline smallbtn" data-tab="pagos" style="margin-top:9px">Ver mis pagos</button></section>':''}
async function enableNotifications(){if(!('Notification' in window)){alert('Este dispositivo o navegador no admite estas notificaciones. Las alertas seguirán apareciendo dentro de la app.');return}try{const permission=await Notification.requestPermission();if(permission==='granted'){alert('Avisos activados. Se comprobarán al abrir la app; para avisos con la app cerrada se necesitará un servicio adicional.');scanNotifications(true)}else alert('Permiso no concedido. Las alertas dentro de la app siguen disponibles.')}catch(e){alert('No se pudieron activar las notificaciones en este navegador.')}}
function scanNotifications(force=false){if(!('Notification' in window)||Notification.permission!=='granted'||document.visibilityState==='hidden')return;const due=dueAlerts();if(!due.length)return;const key='mivida360_notice_'+dateToday();if(!force&&localStorage.getItem(key))return;try{new Notification('MI VIDA 360 · Pagos pendientes',{body:due.length+' pago(s) vencidos o próximos. Abre la app para verlos.',tag:'mivida360-due'});localStorage.setItem(key,'1')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')scanNotifications()});
function handleSubmit(e){if(e.target.id!=='editForm')return;e.preventDefault();let f=e.target,k=f.dataset.kind,obj=formData(f),oldId=f.dataset.id;let old,collection,record;
if(k==='contribute'){let g=state.goals.find(x=>x.id===obj.goalId);let am=validateMoney(obj.amount);if(!g||am===null)return alert('Ingresa un monto válido.');let delta=obj.direction==='Retirar ahorro'?-am:am;if(goalTotal(g)+delta<0)return alert('El retiro supera el ahorro registrado en la meta.');g.entries=g.entries||[];g.entries.push({id:id(),date:dateToday(),amount:delta});persist();close();render();return;}
collection={movement:'movements',goal:'goals',purchase:'purchases',event:'events',payment:'payments'}[k];if(!collection)return;old=state[collection].find(x=>x.id===oldId);const title=String(obj.title||'').trim();if(!title)return alert('Escribe un nombre.');record={...old,id:old?.id||id(),title};
if(k==='movement'){let n=validateMoney(obj.amount);if(n===null||!/^\d{4}-\d\d-\d\d$/.test(obj.date))return alert('Revisa el monto y la fecha.');Object.assign(record,{amount:n,date:obj.date,type:obj.type==='ingreso'?'ingreso':'gasto',category:String(obj.category||'Otros')});}
if(k==='goal'){let n=validateMoney(obj.target);if(n===null)return alert('Escribe un monto válido.');Object.assign(record,{target:n,entries:old?.entries||[]});}
if(k==='purchase'){let n=validateMoney(obj.price,true);if(n===null)return alert('Revisa el precio.');Object.assign(record,{price:n,priority:['Alta','Media','Baja'].includes(obj.priority)?obj.priority:'Media',bought:old?.bought||false,due:/^\d{4}-\d\d-\d\d$/.test(obj.due||'')?obj.due:''});}
if(k==='event'){if(!/^\d{4}-\d\d-\d\d$/.test(obj.date))return alert('Revisa la fecha.');Object.assign(record,{date:obj.date,time:String(obj.time||''),category:String(obj.category||'Personal'),completed:old?.completed||false});}
if(k==='payment'){let n=validateMoney(obj.amount);if(n===null||!/^\d{4}-\d\d-\d\d$/.test(obj.due))return alert('Revisa el monto y la fecha.');Object.assign(record,{amount:n,due:obj.due,paid:old?.paid||false,recurrence:obj.recurrence==='Mensual'?'Mensual':'No repetir'});}
if(old)Object.assign(old,record);else state[collection].push(record);persist();if(k==='payment')generateRecurring();close();render()}
function backup(){let blob=new Blob([JSON.stringify({app:'MI VIDA 360 Móvil',version:1,exportedAt:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=`MI_VIDA_360_copia_${dateToday()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function openSettings(){if(accessMode==='locked')return;modal('Mi privacidad y datos',`<div class="callout">🔒 ${accessMode==='cloud'?'Cuenta: '+esc(accountUser?.email||'Firebase')+'. Tus datos se guardan en Firestore.':'Modo sin cuenta: tus registros se guardan solo en este dispositivo.'} Exporta respaldos JSON periódicamente.</div><div class="settingslist margintop"><button class="outline" data-action="account">${accessMode==='cloud'?'Cerrar sesión':'Ir a iniciar sesión'}</button><button class="outline" data-action="notify">🔔 Activar avisos al abrir la app</button>${accessMode==='cloud'?'<button class="outline" data-action="push">📲 Activar recordatorios con la app cerrada</button>':''}<div class="syncnote">Recordatorios preparados para pagos, actividades de Agenda y compras pendientes. Los avisos de actividades con hora dependen de las ejecuciones programadas de GitHub y pueden retrasarse. Para las notificaciones con la app cerrada, abre MI VIDA 360 desde su ícono en el iPhone y activa los avisos push.</div><button class="outline" data-action="export">↓ Guardar copia de seguridad (.json)</button><button class="outline" data-action="import">↑ Recuperar una copia (.json)</button><button class="outline" data-action="demo">◇ Cargar datos de ejemplo</button><button class="outline danger" data-action="clear">Borrar todos mis datos</button></div><p class="safezone">Una copia JSON contiene tus datos personales. Guárdala en un lugar privado. Desinstalar la app o borrar datos de Safari puede eliminar la información local.</p>`)}
function addDemo(){let count=Object.values(state).reduce((n,v)=>n+v.length,0);if(count&&!confirm('Esto REEMPLAZARÁ tus datos actuales con datos de ejemplo. ¿Continuar?'))return;let now=dateToday();state={movements:[{id:id(),type:'ingreso',title:'Sueldo de ejemplo',category:'Sueldo',date:now,amount:2000},{id:id(),type:'gasto',title:'Almuerzo',category:'Alimentación',date:now,amount:18},{id:id(),type:'gasto',title:'Transporte',category:'Transporte',date:now,amount:6}],goals:[{id:id(),title:'Fondo de emergencia',target:1500,entries:[{id:id(),amount:280,date:now}]}],purchases:[{id:id(),title:'Audífonos',price:120,priority:'Media',bought:false}],events:[{id:id(),title:'Revisar pendientes',date:now,time:'19:00',category:'Personal'}],payments:[{id:id(),title:'Recibo de internet',amount:90,due:now,paid:false}]};persist();close();render()}
function handleClick(e){let b=e.target.closest('button');if(!b)return;if(b.dataset.action==='account'){switchAccount();return}if(accessMode==='locked')return;if(b.dataset.tab){navigate(b.dataset.tab);return}let act=b.dataset.action,k=b.dataset.kind,v=b.dataset.id;if(!act)return;
if(act==='close')close();if(act==='new')openForm(k);if(act==='contribute')openContribute(v);
if(act==='movetype'){let form=document.getElementById('editForm');form.elements.type.value=b.dataset.value;document.querySelectorAll('[data-action=movetype]').forEach(x=>x.classList.toggle('on',x.dataset.value===b.dataset.value));document.getElementById('catSelect').innerHTML=select('category','Categoría',b.dataset.value==='gasto'?catExpense:catIncome,b.dataset.value==='gasto'?'Alimentación':'Sueldo')}
if(act==='edit'||act==='delete'||act==='toggle'){let key={movement:'movements',goal:'goals',purchase:'purchases',event:'events',payment:'payments'}[k],item=state[key]?.find(x=>x.id===v);if(!item)return;if(act==='edit')openForm(k,item);if(act==='delete'&&confirm('¿Eliminar “'+item.title+'”?')){state[key]=state[key].filter(x=>x.id!==v);persist();render()}if(act==='toggle'){if(k==='purchase')item.bought=!item.bought;if(k==='payment')item.paid=!item.paid;if(k==='event')item.completed=!item.completed;persist();render()}}
if(act==='push'){if(accessMode!=='cloud'||!accountApi){alert('Inicia sesión en tu cuenta primero.');return}accountApi.setupPush().then(()=>alert('Tu iPhone ya está registrado para avisos push. Falta verificar el envío automático desde GitHub Actions.')).catch(e=>alert(accountApi.explain(e)));}if(act==='notify')enableNotifications();if(act==='export')backup();if(act==='import')document.getElementById('importFile').click();if(act==='demo')addDemo();if(act==='clear'&&confirm('¿Borrar todos los registros? Esta acción no se puede deshacer sin una copia de seguridad.')){state=emptyState();persist();close();render()}}
document.addEventListener('click',handleClick);document.getElementById('settingsBtn').addEventListener('click',openSettings);document.getElementById('modalRoot').addEventListener('click',e=>{if(e.target.id==='back')close()});document.addEventListener('submit',handleSubmit);
document.getElementById('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>5_000_000)throw Error('El archivo es demasiado grande.');let v=JSON.parse(await file.text());let data=v.data||v;if(!data||typeof data!=='object'||!Array.isArray(data.movements)||!Array.isArray(data.goals))throw Error('No parece una copia válida de MI VIDA 360.');if(!confirm('Esta copia reemplazará los datos actuales. ¿Continuar?'))return;state=normalize(data);persist();close();render();alert('Copia recuperada.')}catch(err){alert('No se pudo importar: '+err.message)}finally{e.target.value=''}});
document.addEventListener('change',e=>{if(e.target.id==='month'&&/^\d{4}-\d\d$/.test(e.target.value)){currentMonth=e.target.value;render()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
window.MI360App={
 cloudReady(api){accountApi=api;window.MI360AuthUI?.updateReady()},
 cloudFailed(msg){window.MI360AuthUI?.failed(msg)},
 cloudWarning(msg){console.warn('MI VIDA 360 Firebase:',msg)},
 useLocal(){accessMode='local';accountUser=null;state=load();generateRecurring();window.MI360AuthUI?.hide();render();scanNotifications()},
 async cloudSignedIn(user,remote,options){
  if(accessMode==='local')return null;
  accountUser=user;
  if(options.exists){
   if(!remote||!Array.isArray(remote.movements)||!Array.isArray(remote.goals)){
    alert('Los registros de Firebase no tienen el formato esperado. No se sobrescribirán.');
    return null;
   }
   state=normalize(remote);
  }else if(options.offline){
   let cached=null;
   try{cached=JSON.parse(localStorage.getItem(accountCacheKey(user.uid))||'null')}catch(e){}
   if(!cached||!Array.isArray(cached.movements)){
    alert('No pude descargar los registros de tu cuenta. Comprueba tu conexión a Internet.');
    return null;
   }
   state=normalize(cached);
  }else{
   const original=load();
   state=hasItems(original)&&confirm('Encontramos tus registros antiguos de MI VIDA 360 en este navegador. ¿Quieres copiarlos a tu cuenta de Firebase?')?normalize(original):emptyState();
  }
  accessMode='cloud';
  try{localStorage.setItem(accountCacheKey(user.uid),JSON.stringify(state))}catch(e){}
  generateRecurring();window.MI360AuthUI?.hide();render();scanNotifications();
  return !options.exists&&!options.offline?JSON.parse(JSON.stringify(state)):null;
 },
 cloudSignedOut(){if(accessMode!=='local'){accessMode='locked';accountUser=null;state=emptyState();window.MI360AuthUI?.show()}},
 cloudRemote(remote){if(accessMode!=='cloud'||cloudWrites>0)return;
  if(!remote||!Array.isArray(remote.movements)||!Array.isArray(remote.goals))return;
  let incoming=normalize(remote);
  if(JSON.stringify(incoming)!==JSON.stringify(state)){
   state=incoming;try{localStorage.setItem(accountCacheKey(accountUser.uid),JSON.stringify(state))}catch(e){}render();
  }
 }
};
async function switchAccount(){
 if(accessMode==='local'){accessMode='locked';state=emptyState();close();window.MI360AuthUI?.show();return}
 if(accessMode==='cloud'&&accountApi){close();try{await accountApi.logout()}catch(err){alert(accountApi.explain(err))}}
}
render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}
})();
</script>

import('./firebase-cloud.js').catch(error=>{
 console.error('MI VIDA 360 Firebase no pudo cargar:',error);
 window.MI360App?.cloudFailed(error?.message||'Error de conexión');
});
</script>
